query TenantUsage {
  tenantUsage {
    tenantId
    logicalBytes
    storedBytes
    compressedBytes
    deduplicationSavedBytes
    compressionSavedBytes
    repositoryCount
    releaseCount
    maxStorageBytes
    isLimited
    storageUsedFraction
    isStorageAllowed
    isIngestAllowed
    isEgressAllowed
  }
}
