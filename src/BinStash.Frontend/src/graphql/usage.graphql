query TenantUsage {
  tenantUsage {
    tenantId
    logicalBytes
    uniqueLogicalBytes
    deduplicationSavedBytes
    footprintComputedAt
    repositoryCount
    releaseCount
    maxStorageBytes
    isLimited
    storageUsedFraction
    isStorageAllowed
    isIngestAllowed
    isEgressAllowed
  }
}
