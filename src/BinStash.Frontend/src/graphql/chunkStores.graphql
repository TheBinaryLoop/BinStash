fragment ChunkStoreSummary on ChunkStoreGql {
  id
  name
  type
  probeMode
  minFreeBytes
  chunker { type minChunkSize avgChunkSize maxChunkSize }
  backendSettings { backendType localPath }
}

fragment ChunkStoreStatsDetail on ChunkStoreStatsGql {
  totalChunks
  collectedAt
  chunkCount
  fileDefinitionCount
  releaseCount
  chunkPackBytes
  fileDefinitionPackBytes
  releasePackageBytes
  indexBytes
  physicalBytesTotal
  totalLogicalBytes
  uniqueLogicalChunkBytes
  uniqueCompressedChunkBytes
  compressionRatio
  deduplicationRatio
  effectiveStorageRatio
  compressionSavedBytes
  deduplicationSavedBytes
  chunkPackFileCount
  fileDefinitionPackFileCount
  releasePackageFileCount
  indexFileCount
  volumeTotalBytes
  volumeFreeBytes
  avgChunkSize
  avgCompressedChunkSize
}

query ChunkStores($first: Int, $after: String, $where: ChunkStoreGqlFilterInput) {
  chunkStores(first: $first, after: $after, where: $where, order: [{ name: ASC }]) {
    totalCount
    pageInfo { hasNextPage endCursor }
    nodes { ...ChunkStoreSummary }
  }
}

query ChunkStore($id: UUID!) {
  chunkStore(id: $id) { ...ChunkStoreSummary }
}

query ChunkStoreStats($chunkStoreId: UUID!) {
  chunkStoreStats(chunkStoreId: $chunkStoreId) { ...ChunkStoreStatsDetail }
}

query ChunkStoreStatsHistory($chunkStoreId: UUID!, $days: Int!) {
  chunkStoreStatsHistory(chunkStoreId: $chunkStoreId, days: $days) {
    collectedAt
    physicalBytesTotal
    totalLogicalBytes
    volumeFreeBytes
    chunkCount
  }
}

query EnabledChunkStoreTypes {
  enabledChunkStoreTypes { name value }
}

fragment BackgroundJobSummary on BackgroundJobGql {
  id
  jobType
  status
  chunkStoreId
  createdAt
  startedAt
  completedAt
  errorDetails
  rebuildProgress { totalBuckets processedBuckets failedBuckets }
  upgradeProgress {
    targetSerializerVersion
    totalReleases
    processedReleases
    failedReleases
    skippedReleases
    bytesSaved
    bytesGrown
  }
  gcProgress {
    phase
    totalBuckets
    processedBuckets
    totalReleases
    markedReleases
    resolvedFileDefinitions
    processedFileDefinitionGroups
    totalFileDefinitionGroups
    reachableObjects
    quarantinedObjects
    quarantinedBytes
    reclaimedObjects
    reclaimedBytes
    deferredObjects
    packsSealed
    packsCompacted
    packsDeleted
    packBytesDeleted
    resurrectedObjects
    dryRun
  }
}

query BackgroundJobs($first: Int, $after: String, $jobType: String, $chunkStoreId: UUID) {
  backgroundJobs(
    first: $first
    after: $after
    jobType: $jobType
    chunkStoreId: $chunkStoreId
    order: [{ createdAt: DESC }]
  ) {
    totalCount
    pageInfo { hasNextPage endCursor }
    nodes { ...BackgroundJobSummary }
  }
}

query BackgroundJob($id: UUID!) {
  backgroundJob(id: $id) { ...BackgroundJobSummary }
}

mutation CreateChunkStore($input: CreateChunkStoreInput!) {
  createChunkStore(input: $input) { ...ChunkStoreSummary }
}

mutation RebuildChunkStore($chunkStoreId: UUID!) {
  rebuildChunkStore(chunkStoreId: $chunkStoreId) { ...BackgroundJobSummary }
}

mutation UpgradeChunkStore($chunkStoreId: UUID!) {
  upgradeChunkStore(chunkStoreId: $chunkStoreId) { ...BackgroundJobSummary }
}

mutation CollectChunkStoreGarbage(
  $chunkStoreId: UUID!
  $dryRun: Boolean!
  $skipReclaim: Boolean!
  $retentionHours: Float
) {
  collectChunkStoreGarbage(
    chunkStoreId: $chunkStoreId
    dryRun: $dryRun
    skipReclaim: $skipReclaim
    retentionHours: $retentionHours
  ) { ...BackgroundJobSummary }
}

mutation CancelBackgroundJob($jobId: UUID!) {
  cancelBackgroundJob(jobId: $jobId) { ...BackgroundJobSummary }
}

subscription BackgroundJobProgress($jobId: UUID!) {
  backgroundJobProgress(jobId: $jobId) {
    jobId
    jobType
    status
    totalReleases
    processedReleases
    failedReleases
    skippedReleases
    bytesSaved
    bytesGrown
    totalBuckets
    processedBuckets
    failedBuckets
    gcPhase
    markedReleases
    resolvedFileDefinitions
    processedFileDefinitionGroups
    totalFileDefinitionGroups
    reachableObjects
    quarantinedObjects
    quarantinedBytes
    reclaimedObjects
    reclaimedBytes
    deferredObjects
    packsSealed
    packsCompacted
    packsDeleted
    packBytesDeleted
    resurrectedObjects
    gcDryRun
    chunkStoreId
    startedAt
    completedAt
  }
}
