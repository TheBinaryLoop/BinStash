type Mutation {
  createTenant(input: CreateTenantInput!): TenantGql
    @authorize
    @cost(weight: "10")
  updateTenant(input: UpdateTenantInput!): TenantGql
    @authorize
    @cost(weight: "10")
  createRepository(input: CreateRepositoryInput!): RepositoryGql
    @authorize
    @cost(weight: "10")
  updateRepository(input: UpdateRepositoryInput!): RepositoryGql
    @authorize
    @cost(weight: "10")
  moveRepository(input: MoveRepositoryInput!): RepositoryGql
    @authorize
    @cost(weight: "10")
  createServiceAccount(input: CreateServiceAccountInput!): ServiceAccountGql
    @authorize
    @cost(weight: "10")
  updateServiceAccount(input: UpdateServiceAccountInput!): ServiceAccountGql
    @authorize
    @cost(weight: "10")
  deleteServiceAccount(accountId: UUID!): Boolean @authorize @cost(weight: "10")
  createChunkStore(input: CreateChunkStoreInput!): ChunkStoreGql
    @authorize
    @cost(weight: "10")
  rebuildChunkStore(chunkStoreId: UUID!): BackgroundJobGql
    @authorize
    @cost(weight: "10")
  upgradeChunkStore(chunkStoreId: UUID!): BackgroundJobGql
    @authorize
    @cost(weight: "10")
  collectChunkStoreGarbage(
    chunkStoreId: UUID!
    dryRun: Boolean! = false
    skipReclaim: Boolean! = false
    retentionHours: Float
  ): BackgroundJobGql @authorize @cost(weight: "10")
  cancelBackgroundJob(jobId: UUID!): BackgroundJobGql
    @authorize
    @cost(weight: "10")
  sendTestEmail(recipientEmail: String!): SendTestEmailResultGql
    @authorize
    @cost(weight: "10")
  setEmailConfig(input: SetEmailConfigInput!): EmailConfigGql
    @authorize
    @cost(weight: "10")
  setTenancyConfig(input: SetTenancyConfigInput!): TenancyConfigGql
    @authorize
    @cost(weight: "10")
  setDomainConfig(input: SetDomainConfigInput!): DomainConfigGql
    @authorize
    @cost(weight: "10")
  setGcConfig(input: SetGcConfigInput!): GcConfigGql!
    @authorize
    @cost(weight: "10")
  setStorageClassDefaultMappings(input: SetStorageClassDefaultMappingsInput!): Boolean!
    @authorize
    @cost(weight: "10")
  grantRepositoryAccess(
    repoId: UUID!
    subjectType: Short!
    subjectId: UUID!
    role: String!
  ): RepositoryAccessGql @authorize @cost(weight: "10")
  revokeRepositoryAccess(repoId: UUID!, subjectType: Short!, subjectId: UUID!): Boolean!
    @authorize
    @cost(weight: "10")
  createServiceAccountApiKey(
    serviceAccountId: UUID!
    input: CreateServiceAccountApiKeyInput!
  ): CreateApiKeyResultGql @authorize @cost(weight: "10")
  deleteServiceAccountApiKey(serviceAccountId: UUID!, apiKeyId: UUID!): Boolean!
    @authorize
    @cost(weight: "10")
  inviteTenantMember(input: InviteTenantMemberInput!): Boolean!
    @authorize
    @cost(weight: "10")
  updateTenantMemberRoles(memberId: UUID!, roles: [String!]!): TenantMemberGql
    @authorize
    @cost(weight: "10")
  removeTenantMember(memberId: UUID!): Boolean! @authorize @cost(weight: "10")
  leaveTenant: Boolean! @authorize @cost(weight: "10")
  acceptTenantInvitation(tenantId: UUID!, code: String!): Boolean!
    @authorize
    @cost(weight: "10")
  deleteTenant(tenantId: UUID!): Boolean! @authorize @cost(weight: "10")
}

type Subscription {
  backgroundJobProgress(jobId: UUID!): BackgroundJobProgressDto @authorize
}

