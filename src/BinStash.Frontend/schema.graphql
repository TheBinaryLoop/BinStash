    @authorize
    @cost(weight: "10")
  serviceAccountApiKeys(serviceAccountId: UUID!): [ApiKeyInfoGql!]!
    @authorize
    @cost(weight: "10")
  tenantMembers: [TenantMemberGql!]! @authorize @cost(weight: "10")
  tenantStorageClasses: [TenantStorageClassGql!]! @authorize @cost(weight: "10")
