schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Query {
  currentTenant: TenantGql! @authorize @cost(weight: "10")
  tenants(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: TenantGqlFilterInput @cost(weight: "10")
    order: [TenantGqlSortInput!] @cost(weight: "10")
  ): TenantsConnection
    @authorize
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 25
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  tenant(id: UUID!): TenantGql @authorize @cost(weight: "10")
  repositories(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: RepositoryGqlFilterInput @cost(weight: "10")
    order: [RepositoryGqlSortInput!] @cost(weight: "10")
  ): RepositoriesConnection
    @authorize
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 25
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  repository(id: UUID!): RepositoryGql @authorize @cost(weight: "10")
  repositoryByName(name: String!): RepositoryGql @authorize @cost(weight: "10")
  repositoryMoveTargets(repoId: UUID!): [RepositoryMoveTargetGql!]
    @authorize
    @cost(weight: "10")
  release(id: UUID!): ReleaseGql @authorize @cost(weight: "10")
  chunkStores(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ChunkStoreGqlFilterInput @cost(weight: "10")
    order: [ChunkStoreGqlSortInput!] @cost(weight: "10")
  ): ChunkStoresConnection
    @authorize
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 25
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  chunkStore(id: UUID!): ChunkStoreGql @authorize @cost(weight: "10")
  serviceAccounts(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: ServiceAccountGqlFilterInput @cost(weight: "10")
    order: [ServiceAccountGqlSortInput!] @cost(weight: "10")
  ): ServiceAccountsConnection
    @authorize
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 25
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  users(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: UserGqlFilterInput @cost(weight: "10")
    order: [UserGqlSortInput!] @cost(weight: "10")
  ): UsersConnection
    @authorize
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 25
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  backgroundJobs(
    jobType: String
    chunkStoreId: UUID
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    order: [BackgroundJobGqlSortInput!] @cost(weight: "10")
  ): BackgroundJobsConnection
    @authorize
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 25
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
