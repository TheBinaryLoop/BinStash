  chunkStoreStats(chunkStoreId: UUID!): ChunkStoreStatsGql
    @authorize
    @cost(weight: "10")
  chunkStoreStatsHistory(chunkStoreId: UUID!, days: Int! = 30): [ChunkStoreStatsGql!]!
    @authorize
    @cost(weight: "10")
  enabledChunkStoreTypes: [ChunkStoreTypeInfoGql!]!
    @authorize
    @cost(weight: "10")
  tenantUsage: TenantUsageGql! @authorize @cost(weight: "10")
  tenantTraffic(grain: TrafficGrainGql!, fromUtc: DateTime, toUtc: DateTime): TrafficSeriesGql!
    @authorize
    @cost(weight: "10")
  instanceTraffic(grain: TrafficGrainGql!, fromUtc: DateTime, toUtc: DateTime): InstanceTrafficGql!
    @authorize
    @cost(weight: "10")
  auditLog(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
    where: AuditLogEntryGqlFilterInput @cost(weight: "10")
    order: [AuditLogEntryGqlSortInput!] @cost(weight: "10")
  ): AuditLogConnection
    @authorize
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 25
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
  instanceAuditLog(
    "Returns the first _n_ elements from the list."
    first: Int
    "Returns the elements in the list that come after the specified cursor."
    after: String
    "Returns the last _n_ elements from the list."
    last: Int
    "Returns the elements in the list that come before the specified cursor."
    before: String
