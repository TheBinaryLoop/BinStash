    order: [AuditLogEntryGqlSortInput!] @cost(weight: "10")
  ): InstanceAuditLogConnection
    @authorize
    @listSize(
      assumedSize: 100
      slicingArguments: ["first", "last"]
      slicingArgumentDefaultValue: 25
      sizedFields: ["edges", "nodes"]
      requireOneSlicingArgument: false
    )
    @cost(weight: "10")
